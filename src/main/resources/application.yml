server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: faker-data
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
faker:
  data-dir: ${FAKER_DATA_DIR:./data}
  tasks:
    workers: ${FAKER_TASK_WORKERS:2}
    queue-capacity: ${FAKER_TASK_QUEUE_CAPACITY:100}
  cache:
    backend: ${FAKER_CACHE_BACKEND:memory}
    max-entries: ${FAKER_CACHE_MAX_ENTRIES:500000}
    max-bytes: ${FAKER_CACHE_MAX_BYTES:134217728}
    redis-host: ${FAKER_REDIS_HOST:127.0.0.1}
    redis-port: ${FAKER_REDIS_PORT:6379}
    redis-database: ${FAKER_REDIS_DATABASE:0}
    redis-password: ${FAKER_REDIS_PASSWORD:}
