name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the bundled UI
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Verify and package
        run: |
          chmod +x mvnw
          ./mvnw -B -Dfaker.redis.test.port=6379 verify
      - name: Verify the MCP adapter boundaries
        run: |
          python3 -m venv .mcp-venv
          .mcp-venv/bin/python -m pip install -r integrations/mcp/requirements.txt
          .mcp-venv/bin/python -m unittest discover -s integrations/mcp -p test_server.py -v
          .mcp-venv/bin/python -m unittest discover -s integrations/mcp -p test_bootstrap.py -v
          .mcp-venv/bin/python -m unittest discover -s integrations/mcp -p test_order_lifecycle.py -v
          .mcp-venv/bin/python -m unittest discover -s integrations/mcp -p test_flowable_recipe.py -v
          .mcp-venv/bin/python -m unittest discover -s examples/local-extension -p test_generate.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faker-data-jar
          path: target/faker-data-*.jar

  runtime-matrix:
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', java: '8'}
          - {os: ubuntu-latest, python: '3.13', java: '17'}
          - {os: windows-latest, python: '3.10', java: '8'}
          - {os: windows-latest, python: '3.13', java: '17'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: faker-data-jar
          path: runtime-jar
      - name: Verify packaged Java, assets and real stdio MCP
        shell: bash
        run: |
          python -m pip install -r integrations/mcp/requirements.txt
          python -m unittest discover -s integrations/mcp -p test_bootstrap.py -v
          python integrations/mcp/verify_runtime.py --jar runtime-jar/faker-data-0.1.1.jar --report runtime-result.json

  native-mysql:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-only
          MYSQL_DATABASE: faker_ci_demo
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-disposable-only" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: faker-data-jar
          path: runtime-jar
      - name: Initialize disposable fixture
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -i -e MYSQL_PWD=ci-disposable-only "$MYSQL_CONTAINER" mysql -uroot faker_ci_demo < examples/mysql-order-schema.sql
          python - <<'PY'
          import json
          from pathlib import Path
          Path('ci-connections.json').write_text(json.dumps({'default': {'type': 'MYSQL', 'url': 'jdbc:mysql://127.0.0.1:3306/faker_ci_demo?allowPublicKeyRetrieval=true&useSSL=false', 'username': 'root', 'password': 'ci-disposable-only'}}), encoding='utf-8')
          PY
      - name: Verify actual MySQL MCP lifecycle and exact cleanup
        run: |
          python -m pip install -r integrations/mcp/requirements.txt
          python integrations/mcp/verify_runtime.py --jar runtime-jar/faker-data-0.1.1.jar --profiles ci-connections.json --confirm-demo-write --report native-result.json
      - name: Verify only original fixture customers remain
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          result=$(docker exec -e MYSQL_PWD=ci-disposable-only "$MYSQL_CONTAINER" mysql -uroot -N -B faker_ci_demo -e "SELECT (SELECT COUNT(*) FROM demo_customers), (SELECT COUNT(*) FROM demo_orders), (SELECT COUNT(*) FROM demo_order_items), (SELECT COUNT(*) FROM demo_order_contents), (SELECT COUNT(*) FROM demo_order_tasks)")
          test "$result" = $'3\t0\t0\t0\t0'
