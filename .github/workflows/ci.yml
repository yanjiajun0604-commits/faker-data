name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the bundled UI
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Verify and package
        run: |
          chmod +x mvnw
          ./mvnw -B -Dfaker.redis.test.port=6379 verify
      - uses: actions/upload-artifact@v4
        with:
          name: faker-data-jar
          path: target/faker-data-*.jar
