name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the bundled UI
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Verify and package
        run: |
          chmod +x mvnw
          ./mvnw -B -Dfaker.redis.test.port=6379 verify
      - name: Verify the MCP adapter boundaries
        run: |
          python3 -m venv .mcp-venv
          .mcp-venv/bin/python -m pip install -r integrations/mcp/requirements.txt
          .mcp-venv/bin/python -m unittest discover -s integrations/mcp -p test_server.py -v
          .mcp-venv/bin/python -m unittest discover -s integrations/mcp -p test_bootstrap.py -v
          .mcp-venv/bin/python -m unittest discover -s integrations/mcp -p test_order_lifecycle.py -v
          .mcp-venv/bin/python -m unittest discover -s integrations/mcp -p test_flowable_recipe.py -v
          .mcp-venv/bin/python -m unittest discover -s examples/local-extension -p test_generate.py -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faker-data-jar
          path: target/faker-data-*.jar

  runtime-matrix:
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', java: '8'}
          - {os: ubuntu-latest, python: '3.13', java: '17'}
          - {os: windows-latest, python: '3.10', java: '8'}
          - {os: windows-latest, python: '3.13', java: '17'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: faker-data-jar
          path: runtime-jar
      - name: Verify packaged Java, assets and real stdio MCP
        shell: bash
        run: |
          python -m pip install -r integrations/mcp/requirements.txt
          python -m unittest discover -s integrations/mcp -p test_bootstrap.py -v
          python integrations/mcp/verify_runtime.py --jar runtime-jar/faker-data-0.1.2.jar --report runtime-result.json

  native-mysql:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-only
          MYSQL_DATABASE: faker_ci_demo
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-disposable-only" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: faker-data-jar
          path: runtime-jar
      - name: Initialize disposable fixture
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -i -e MYSQL_PWD=ci-disposable-only "$MYSQL_CONTAINER" mysql -uroot faker_ci_demo < examples/mysql-order-schema.sql
          docker exec -i -e MYSQL_PWD=ci-disposable-only "$MYSQL_CONTAINER" mysql -uroot <<'SQL'
          CREATE USER 'faker_ci_schema'@'%' IDENTIFIED BY 'ci-schema-disposable-only';
          GRANT ALL ON faker_ci_demo.* TO 'faker_ci_schema'@'%';
          SQL
          python - <<'PY'
          import json
          from pathlib import Path
          url = 'jdbc:mysql://127.0.0.1:3306/faker_ci_demo?allowPublicKeyRetrieval=true&useSSL=false'
          Path('ci-connections.json').write_text(json.dumps({
              'default': {'type': 'MYSQL', 'url': url, 'username': 'root', 'password': 'ci-disposable-only'},
              'schema_only': {'type': 'MYSQL', 'url': url, 'username': 'faker_ci_schema', 'password': 'ci-schema-disposable-only'},
          }), encoding='utf-8')
          PY
      - name: Verify actual MySQL MCP lifecycle and exact cleanup
        run: |
          python -m pip install -r integrations/mcp/requirements.txt
          python integrations/mcp/verify_runtime.py --jar runtime-jar/faker-data-0.1.2.jar --schema-only-profile schema_only --profiles ci-connections.json --confirm-demo-write --report native-result.json
      - name: Verify only original fixture customers remain
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          result=$(docker exec -e MYSQL_PWD=ci-disposable-only "$MYSQL_CONTAINER" mysql -uroot -N -B faker_ci_demo -e "SELECT (SELECT COUNT(*) FROM demo_customers), (SELECT COUNT(*) FROM demo_orders), (SELECT COUNT(*) FROM demo_order_items), (SELECT COUNT(*) FROM demo_order_contents), (SELECT COUNT(*) FROM demo_order_tasks)")
          test "$result" = $'3\t0\t0\t0\t0'
